server {
  listen 80;
  server_name _;

  # The application accepts a 75 MiB PDF. Leave room for multipart metadata
  # so files at the documented limit reach FastAPI instead of failing at Nginx.
  client_max_body_size 76m;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    # Summaries and quizzes may require several sequential model calls. Keep
    # the connection open long enough for the API to return the completed run.
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    # This is a local/demo frontend that changes frequently. Prevent the
    # browser from retaining an old app bundle whose API flow no longer
    # matches the running backend.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }
}
